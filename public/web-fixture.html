<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>网页转 PDF 测试页</title>
    <style>
      body { font-family: sans-serif; margin: 0; color: #111; }
      .hero { padding: 32px; }
      h1 { font-size: 28px; }
      p { line-height: 1.6; }
      .btn-row {
        display: flex;
        flex-wrap: nowrap;
        gap: 10px;
        padding: 0 32px 24px;
      }
      .btn-row button {
        flex: 0 0 auto;
        white-space: nowrap;
        padding: 10px 18px;
        border: 0;
        border-radius: 10px;
        background: #2f6bff;
        color: #fff;
        font-size: 14px;
      }
      .spacer { height: 1600px; }
      #lazy-slot { padding: 32px; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="hero">
      <h1>网页转 PDF 测试页</h1>
      <p>这是给 PDF小助手用来生成 PDF 的测试页。</p>
      <p>PDF_HELPER_HEAD_OK</p>
    </div>
    <div class="btn-row">
      <button type="button">保存当前草稿</button>
      <button type="button">分享给同事查看</button>
      <button type="button">导出全部记录</button>
      <button type="button">打开历史版本</button>
    </div>
    <div class="spacer"></div>
    <div id="lazy-slot">等待滚动加载</div>
    <script>
      const slot = document.getElementById('lazy-slot');
      const io = new IntersectionObserver((entries) => {
        if (!entries.some((entry) => entry.isIntersecting)) return;
        slot.textContent = 'PDF_HELPER_LAZY_OK';
        io.disconnect();
      });
      io.observe(slot);
    </script>
  </body>
</html>
